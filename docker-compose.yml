services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefflow
      POSTGRES_PASSWORD: briefflow
      POSTGRES_DB: briefflow
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefflow -d briefflow"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db_data:
